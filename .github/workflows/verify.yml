# Executes every library entry and checks the two claims. Runs on the PUBLIC repository once it
# exists; it is staged here so the move is a directory rename rather than a rewrite.
name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"
      # PACKAGE LISTS ARE DERIVED FROM meta.json, NEVER TYPED HERE. This step used to install a
      # hardcoded c("survival"), so adding an entry that needs sandwich failed with "there is no
      # package called 'sandwich'" -- a CI step asserting its own scope while the entries already
      # declared what they needed. Same defect the harness had with hardcoded field names.
      #
      # The repository is a DATED Posit snapshot rather than latest, which pins transitively. The
      # scipy break on run 1 was exactly this: pinning what a file names and letting its
      # dependencies float still leaves the environment moving, somewhere harder to see.
      - name: R packages
        run: |
          set -euo pipefail
          pkgs=$(python3 -c "
          import json, glob
          names = set()
          for f in glob.glob('lib/*/meta.json'):
              names |= set(json.load(open(f)).get('packages', {}).get('r', {}))
          print(','.join('\"%s\"' % n for n in sorted(names)))
          ")
          echo "installing from meta.json: $pkgs"
          Rscript -e "install.packages(c($pkgs), repos='https://packagemanager.posit.co/cran/__linux__/noble/2026-09-01')"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # SCIPY IS PINNED BECAUSE THE FIRST RUN OF THIS WORKFLOW FAILED WITHOUT IT.
      # statsmodels 0.14.2 imports scipy._lib._util._lazywhere, a private helper newer scipy
      # removed, so pip resolving scipy to latest broke the import outright. Pinning the packages
      # a file names while letting their transitive dependencies float is not pinning: the
      # environment still moves, just somewhere harder to see.
      # Derived from meta.json for the same reason, versions included.
      - name: Python packages
        run: |
          set -euo pipefail
          specs=$(python3 -c "
          import json, glob
          out = {}
          for f in glob.glob('lib/*/meta.json'):
              out.update(json.load(open(f)).get('packages', {}).get('python', {}))
          print(' '.join(f'{k}=={v}' for k, v in sorted(out.items())))
          ")
          echo "installing from meta.json: $specs"
          pip install $specs

      # The lint is a MODULE with its own controls, not inline bash. The inline version was wrong
      # in both of its rules on its first execution: it read a semicolon out of a Stata prose
      # comment, and it demanded event= of a PROC GENMOD statement, where the concept does not
      # exist. Inline CI bash is unreviewed code -- nothing runs it but the runner and nothing
      # tests it at all. harness/lint.test.py carries a negative control for each of those two
      # false positives, built from the exact text that tripped them.
      # THE COMPARATOR HAS CONTROLS NOW TOO. check.py decides both claims for every entry and had
      # none, while its own docstring recorded the time it compared nothing for a primary estimate
      # and reported both claims as holding. It runs FIRST: a broken comparator makes every entry
      # result above meaningless, and finding that out after them reads the wrong way round.
      - name: Controls for the harness itself
        run: |
          python harness/metadata.test.py
          python harness/metadata.py --installed
          python harness/check.test.py
          python harness/lint.test.py
          python harness/lint.py --root lib
          python harness/new_examples.test.py

      - name: Run every entry and check both claims
        run: |
          set -euo pipefail
          fail=0
          for entry in lib/*/; do
            name=$(basename "$entry")
            echo "::group::$name"
            args=()
            # A language that ERRORED contributes no output to the comparison. Passing its
            # traceback made the first run report "no HARNESS block" for Python and say nothing
            # at all about R, which had actually succeeded -- one broken engine hid the other's
            # result. The job still fails (fail=1); it just reports everything it learned first.
            if [ -f "$entry/r.R" ]; then
              if (cd "$entry" && Rscript r.R) > "/tmp/$name.r.txt" 2>&1; then
                args+=(--output "r=/tmp/$name.r.txt")
                sed -n '/--- HARNESS ---/,$p' "/tmp/$name.r.txt" | sed 's/^/  r      /'
              else
                echo "R FAILED"; cat "/tmp/$name.r.txt"; fail=1
              fi
            fi
            if [ -f "$entry/python.py" ]; then
              if (cd "$entry" && python python.py) > "/tmp/$name.py.txt" 2>&1; then
                args+=(--output "python=/tmp/$name.py.txt")
                sed -n '/--- HARNESS ---/,$p' "/tmp/$name.py.txt" | sed 's/^/  python /'
              else
                echo "PYTHON FAILED"; cat "/tmp/$name.py.txt"; fail=1
              fi
            fi
            python harness/check.py --entry "$entry" "${args[@]}" | tee -a /tmp/all.txt || fail=1
            echo "::endgroup::"
          done

          # A ROLLUP, so a weaker guarantee is VISIBLE and not merely non-fatal. An entry with one
          # executed engine passes correctly -- its recovery claim holds -- but it has not tested
          # agreement, and nothing in an exit code says so. mixed-effects-logistic is the standing
          # case: Python has no frequentist GLMM, and substituting GEE would swap the estimand.
          echo "### Library verification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| entry | engines | agreement | result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo ""
          echo "=== rollup ==="
          grep '^SUMMARY|' /tmp/all.txt | while IFS='|' read -r _ name engines agreement result; do
            printf '  %-46s %-14s agreement=%-9s %s\n' "$name" "$engines" "$agreement" "$result"
            echo "| \`$name\` | $engines | $agreement | $result |" >> "$GITHUB_STEP_SUMMARY"
          done
          untested=$(grep -c '|UNTESTED|' /tmp/all.txt || true)
          echo "  entries with the agreement claim UNTESTED: $untested"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Entries with the agreement claim untested: **$untested**" >> "$GITHUB_STEP_SUMMARY"

          exit $fail

